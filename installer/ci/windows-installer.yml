name: Build Garage LPR Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: .\installer\build-installer.ps1

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: garage-lpr-windows-installer
          path: |
            installer/build/output/*.exe
            installer/build/output/*.sha256
          if-no-files-found: error
