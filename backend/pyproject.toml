[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "garage-lpr"
version = "0.1.0"
description = "Offline-first license plate access control for edge deployments"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.20,<2",
  "psutil>=6,<8",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "tzdata>=2024.2; platform_system == 'Windows'",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
windows-service = [
  "pywin32>=308; platform_system == 'Windows'",
]

dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-psutil>=7,<8",
]

[project.scripts]
garage-lpr = "garage_lpr.__main__:main"
garage-lpr-service = "garage_lpr.service.windows:main"
garage-lpr-soak = "garage_lpr.resilience.soak:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_lpr"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
